# Put limit_req_zone in the nginx http context (e.g. a conf.d include).
limit_req_zone $binary_remote_addr zone=catalog_auth:10m rate=10r/m;

server {
    listen 80;
    server_name dos-packages.bendaws.net;
    return 301 https://dos-packages.bendaws.net$request_uri;
}

server {
    listen 443 ssl;
    server_name dos-packages.bendaws.net;
    ssl_certificate /etc/letsencrypt/live/dos-packages.bendaws.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dos-packages.bendaws.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 256m;

    location ~ ^/(register|login|resend)$ {
        limit_req zone=catalog_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 180s;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 180s;
    }
}
