# Enable: a2enmod proxy proxy_http headers
# Add these proxy directives to your existing HTTPS virtual host if it already
# serves dos-packages.bendaws.net. Do not enable a second virtual host for it.
<VirtualHost *:80>
    ServerName dos-packages.bendaws.net
    ProxyRequests Off
    ProxyPreserveHost On
    ProxyAddHeaders Off
    RequestHeader set X-Forwarded-For "expr=%{REMOTE_ADDR}"
    ProxyPass / http://127.0.0.1:8080/ connectiontimeout=5 timeout=180
    ProxyPassReverse / http://127.0.0.1:8080/
    LimitRequestBody 268435456
    ErrorLog ${APACHE_LOG_DIR}/dosxc-catalog-error.log
    CustomLog ${APACHE_LOG_DIR}/dosxc-catalog-access.log combined
</VirtualHost>
# For a new host, enable HTTPS after DNS points to this server:
#   apt-get install certbot python3-certbot-apache
#   certbot --apache -d dos-packages.bendaws.net --redirect
# Keep CATALOG_BASE_URL=https://dos-packages.bendaws.net in .env.
